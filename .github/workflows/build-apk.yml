name: Build Shajamal APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses and install SDK 36.1
        shell: bash
        run: |
          set +o pipefail
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          fi
          echo "Using SDK_ROOT=$SDK_ROOT"
          echo "Using SDKMANAGER=$SDKMANAGER"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            yes | "$SDKMANAGER" --install "platforms;android-36.1" "build-tools;36.0.0" "platform-tools" || true
          fi

      - name: Install Gradle 9.3.1
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-9.3.1/bin" >> "$GITHUB_PATH"

      - name: Ensure debug.keystore exists
        shell: bash
        run: |
          if [ ! -f debug.keystore ] && [ -s debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore || rm -f debug.keystore
            if [ -f debug.keystore ]; then
              keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey >/dev/null 2>&1 || rm -f debug.keystore
            fi
          fi
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "google-services.json present: $([ -f app/google-services.json ] && echo yes || echo no)"

      - name: Build Fast Optimized APK (Release-Speed, Compatible Signature)
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER=$(find "$SDK_ROOT/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -n 1 || true)
          ZIPALIGN=$(find "$SDK_ROOT/build-tools" -name zipalign -type f 2>/dev/null | sort -V | tail -n 1 || true)

          if [ -n "$APKSIGNER" ]; then
            keytool -genkeypair -noprompt \
              -keystore /tmp/ci-temp-release.jks \
              -storepass android \
              -alias upload \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Shajamal CI,O=Shajamal,C=BD"

            KEYSTORE_PATH=/tmp/ci-temp-release.jks \
            STORE_PASSWORD=android \
            KEY_PASSWORD=android \
            gradle :app:assembleRelease \
              --no-daemon \
              --no-configuration-cache \
              --max-workers=2 \
              -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
              --stacktrace

            RAW_APK="app/build/outputs/apk/release/app-release.apk"
            if [ -n "$ZIPALIGN" ]; then
              "$ZIPALIGN" -f -p 4 "$RAW_APK" /tmp/shajamal-aligned.apk
              RAW_APK="/tmp/shajamal-aligned.apk"
            fi

            "$APKSIGNER" sign \
              --ks debug.keystore \
              --ks-pass pass:android \
              --ks-key-alias androiddebugkey \
              --key-pass pass:android \
              --out Shajamal.apk \
              "$RAW_APK"
            "$APKSIGNER" verify Shajamal.apk
            rm -f /tmp/ci-temp-release.jks /tmp/shajamal-aligned.apk
          else
            gradle :app:assembleDebug \
              --no-daemon \
              --no-configuration-cache \
              --max-workers=2 \
              -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
              --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk Shajamal.apk
          fi

      - name: Upload Shajamal.apk Artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Shajamal-APK
          path: Shajamal.apk
          retention-days: 30

      - name: Publish Direct Download Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_NOTES="Tap Shajamal.apk below to download and install directly on your Android phone.

          Latest updates:
          - Recents Tap -> Call History (N) Bottom Sheet: Tap any grouped number to view full call history (Outgoing/Incoming/Missed, SIM/Carrier, date/time, duration, single-entry delete), Call Now, Edit Number, and Block/Unblock
          - Keypad 'Call with' Bottom Sheet: Tap the primary Call button to choose SIM 1, SIM 2, or ICC IP Calling (SIP)
          - Recents 3-Dot (⋮) Menu & Filter Chips: Quick Call button + 3-dot menu (Call history, Edit in keypad, Block, Delete History) and All / Missed / SIP VoIP / Cellular SIM filters
          - SIM 1 & SIM 2 Balance Check (live USSD) + ICC Communication IP Calling (SIP) & ISP Status/Portal
          - Streamlined Settings: Unified Theme & Doodle card (White/Black/System + 10 color themes + 6 doodles), Call Ringtone & Dialpad Tone picker, Notifications & Vibration, Block List, and Language"

          if gh release view latest-apk >/dev/null 2>&1; then
            gh release upload latest-apk Shajamal.apk --clobber
            gh release edit latest-apk \
              --title "Shajamal Android APK (Latest)" \
              --notes "$RELEASE_NOTES" \
              --latest
            gh release delete-asset latest-apk NovaCall.apk -y >/dev/null 2>&1 || true
          else
            gh release create latest-apk Shajamal.apk \
              --title "Shajamal Android APK (Latest)" \
              --notes "$RELEASE_NOTES" \
              --latest
          fi
