name: Build Shajamal APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses and install SDK 36.1
        shell: bash
        run: |
          set +o pipefail
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          fi
          echo "Using SDK_ROOT=$SDK_ROOT"
          echo "Using SDKMANAGER=$SDKMANAGER"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            yes | "$SDKMANAGER" --install "platforms;android-36.1" "build-tools;36.0.0" "platform-tools" || true
          fi

      - name: Install Gradle 9.3.1
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-9.3.1/bin" >> "$GITHUB_PATH"

      - name: Ensure debug.keystore exists
        shell: bash
        run: |
          if [ ! -f debug.keystore ] && [ -s debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore || rm -f debug.keystore
            if [ -f debug.keystore ]; then
              keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey >/dev/null 2>&1 || rm -f debug.keystore
            fi
          fi
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "google-services.json present: $([ -f app/google-services.json ] && echo yes || echo no)"

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            --stacktrace

      - name: Prepare Shajamal.apk
        run: cp app/build/outputs/apk/debug/app-debug.apk Shajamal.apk

      - name: Upload Shajamal.apk Artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Shajamal-APK
          path: Shajamal.apk
          retention-days: 30

      - name: Publish Direct Download Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_NOTES="Tap Shajamal.apk below to download and install directly on your Android phone.

          Latest updates:
          - Liquid Glass Call Screen: Atmospheric frosted glass backdrop, luminous glass avatar sphere, 3x2 frosted action grid (Speaker, Hold, Mute, Add, End Call, Keypad) & 1-tap Call Record pill
          - Incoming Calls Upgrade: Message & Callback Reminder quick actions + adaptive Slide to Answer bar (Show only when locked / Always / Never)
          - Favorites Tab: Dedicated Favorites tab with Edit mode, + Add Favorite picker & 1-tap calling
          - Display Options in Settings: Liquid Glass toggle, Display Theme (System / Light / Dark), Font Size (Small / Medium / Large), Incoming Calls (Full Screen / Banner) & Slide to Answer
          - Floating Liquid Glass Bottom Pill Bar (Favorites, Recents, Contacts, Keypad) & Circular Liquid Glass Keypad
          - Contacts A-Z Fast-Scroll Alphabet Index + Voice Search & Recents Edit / All-Missed Pill Toggle / Search
          - Truecaller-style Unknown Caller ID ('Know Exactly Who's Calling'), Save Contact with Photo & Pure Dual-SIM (SIM 1 & SIM 2)"

          if gh release view latest-apk >/dev/null 2>&1; then
            gh release upload latest-apk Shajamal.apk --clobber
            gh release edit latest-apk \
              --title "Shajamal Android APK (Latest)" \
              --notes "$RELEASE_NOTES" \
              --latest
            gh release delete-asset latest-apk NovaCall.apk -y >/dev/null 2>&1 || true
          else
            gh release create latest-apk Shajamal.apk \
              --title "Shajamal Android APK (Latest)" \
              --notes "$RELEASE_NOTES" \
              --latest
          fi
